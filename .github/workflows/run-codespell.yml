name: Run Codespell

# This repository needs no codespell configuration, so it runs with
# codespell's own defaults: nothing skipped and no ignored words. Pass
# config_file to the reusable workflow if that ever changes.

on:
  push:
    branches: main
    paths-ignore: config.yaml
    
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-workflow-run-codespell:
    name: Run Codespell
    if: github.run_number > 1
    uses: ehennestad/matbox-actions/.github/workflows/codespell-workflow.yml@v1
